version: "2"
linters:
  default: standard
  enable:
    - depguard
    - misspell
    - revive
    - errorlint
  settings:
    depguard:
      rules:
        ui-no-drivers:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/allanmedeiros71/vanitas/internal/db/postgres
              desc: ui must go through internal/db interfaces
            - pkg: github.com/allanmedeiros71/vanitas/internal/db/mysql
              desc: ui must go through internal/db interfaces
            - pkg: github.com/allanmedeiros71/vanitas/internal/db/sqlite
              desc: ui must go through internal/db interfaces
        db-no-ui:
          files:
            - "**/internal/db/**"
          deny:
            - pkg: github.com/allanmedeiros71/vanitas/internal/ui
              desc: db must not depend on ui
            - pkg: github.com/allanmedeiros71/vanitas/internal/app
              desc: db must not depend on app
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/allanmedeiros71/vanitas
